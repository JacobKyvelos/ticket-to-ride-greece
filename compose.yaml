services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_GAME_SERVER_PORT: "3001"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
  server_node_modules:
